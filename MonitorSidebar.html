<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบไซเรนตรวจจับสลับหน้าจอ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
    @keyframes pulse-siren {
      0%, 100% { background-color: #fee2e2; }
      50% { background-color: #fca5a5; }
    }
    .siren-active {
      animation: pulse-siren 0.8s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-3 text-sm min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-3 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-rose-100 text-rose-600 rounded-xl mb-1.5 shadow-inner">
        <i id="mainIcon" class="fa-solid fa-bullhorn text-xl"></i>
      </div>
      <h2 class="font-bold text-slate-800 text-base">ศูนย์ตรวจจับ CheatLogs</h2>
      <p class="text-xs text-slate-500">ระบบส่งเสียงไซเรนเตือนบน Google Sheet</p>
    </div>

    <!-- Status Card & Siren Toggle -->
    <div id="statusCard" class="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 mb-3 transition-colors duration-300">
      <div class="flex items-center justify-between mb-2.5">
        <span class="text-xs font-semibold text-slate-600 flex items-center">
          <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse"></span>
          สถานะ: <span id="statusText" class="ml-1 text-emerald-600 font-bold">กำลังตรวจจับ...</span>
        </span>
        <button onclick="testSiren()" title="ทดสอบเสียงไซเรน"
          class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium transition flex items-center space-x-1">
          <i class="fa-solid fa-volume-high text-[10px]"></i>
          <span>ทดสอบเสียง</span>
        </button>
      </div>

      <!-- สวิตช์เปิด/ปิดเสียง -->
      <label class="flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-200 cursor-pointer">
        <span class="text-xs font-medium text-slate-700 flex items-center">
          <i class="fa-solid fa-bell text-indigo-500 mr-1.5"></i> ส่งเสียงไซเรนเมื่อมีคนสลับจอ
        </span>
        <input type="checkbox" id="toggleSound" checked class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
      </label>

      <!-- ปุ่มหยุดเสียงฉุกเฉิน (จะแสดงเมื่อมีเสียงดัง) -->
      <button id="btnMute" onclick="stopSiren()" 
        class="hidden w-full mt-2.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-xs transition flex items-center justify-center space-x-1.5 shadow-md shadow-rose-200">
        <i class="fa-solid fa-volume-xmark"></i>
        <span>ปิดเสียงไซเรน / รับทราบ</span>
      </button>
    </div>

    <!-- แถบสถิติเหตุการณ์ -->
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-center">
        <div class="text-[11px] text-slate-500">ตรวจพบล่าสุด</div>
        <div id="textLastTime" class="text-xs font-bold text-slate-700 mt-0.5">-</div>
      </div>
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 text-center">
        <div class="text-[11px] text-slate-500">เหตุการณ์ทั้งหมด</div>
        <div id="textTotalCount" class="text-xs font-bold text-indigo-600 mt-0.5">0 รายการ</div>
      </div>
    </div>

    <!-- รายการแจ้งเตือนสด (Live Violations Feed) -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-slate-700 text-xs flex items-center">
          <i class="fa-solid fa-clock-rotate-left mr-1.5 text-slate-400"></i> บันทึกเหตุการณ์สด (Live Feed)
        </h3>
        <button onclick="clearDisplayFeed()" class="text-[10px] text-slate-400 hover:text-slate-600">ล้างรายการ</button>
      </div>

      <div id="feedList" class="space-y-2 max-h-[380px] overflow-y-auto pr-1 text-xs">
        <div id="emptyMsg" class="text-center py-6 text-slate-400 text-xs">
          ยังไม่พบการสลับหน้าจอ<br>ระบบจะส่งเสียงไซเรนทันทีที่มีผู้สอบสลับแท็บ/จอ
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-3 text-center text-[10px] text-slate-400">
    CheatLogs Siren Monitor v1.2 &bull; Google Apps Script
  </div>

  <!-- ========================================================================= -->
  <!-- JavaScript: Polling & Web Audio API Siren -->
  <!-- ========================================================================= -->
  <script>
    let lastKnownRowCount = 1;
    let isPolling = true;
    let pollInterval = null;
    let currentOscillator = null;
    let currentGain = null;
    let isSirenPlaying = false;
    let audioCtx = null;

    // เริ่มต้นระบบเมื่อเปิด Sidebar
    window.addEventListener('DOMContentLoaded', () => {
      initAudioContext();
      // ดึงจำนวนแถวล่าสุดครั้งแรก
      syncInitialRowCount();
      // เริ่มลูปตรวจจับทุกๆ 2.5 วินาที
      pollInterval = setInterval(checkNewCheatLogs, 2500);
    });

    // ปลดล็อก Web Audio API
    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('AudioContext init error:', e);
      }
    }

    // สังเคราะห์เสียงไซเรนฉุกเฉิน (Emergency Siren)
    function playSirenSound(cycles = 3, cycleDuration = 0.5, lowFreq = 650, highFreq = 1250, volume = 0.4) {
      const soundEnabled = document.getElementById('toggleSound').checked;
      if (!soundEnabled) return;

      initAudioContext();
      if (!audioCtx) return;

      try {
        stopSiren(); // หยุดเสียงเดิมก่อนหากมีเล่นค้างอยู่

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';

        const halfCycle = cycleDuration / 2;
        let t = now;
        osc.frequency.setValueAtTime(lowFreq, t);

        for (let i = 0; i < cycles; i++) {
          osc.frequency.linearRampToValueAtTime(highFreq, t + halfCycle);
          osc.frequency.linearRampToValueAtTime(lowFreq, t + cycleDuration);
          t += cycleDuration;
        }

        const totalDuration = cycles * cycleDuration;

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.05);
        gain.gain.setValueAtTime(volume, now + totalDuration - 0.08);
        gain.gain.linearRampToValueAtTime(0.001, now + totalDuration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + totalDuration);

        currentOscillator = osc;
        currentGain = gain;
        isSirenPlaying = true;

        // แสดงปุ่มหยุดเสียงไซเรน และแอนิเมชันกระพริบ
        document.getElementById('btnMute').classList.remove('hidden');
        document.getElementById('statusCard').classList.add('siren-active');

        osc.onended = () => {
          isSirenPlaying = false;
          document.getElementById('btnMute').classList.add('hidden');
          document.getElementById('statusCard').classList.remove('siren-active');
        };
      } catch (e) {
        console.warn('playSirenSound error:', e);
      }
    }

    function stopSiren() {
      if (currentOscillator) {
        try {
          currentOscillator.stop();
          currentOscillator.disconnect();
        } catch (e) {}
        currentOscillator = null;
      }
      isSirenPlaying = false;
      document.getElementById('btnMute').classList.add('hidden');
      document.getElementById('statusCard').classList.remove('siren-active');
    }

    function testSiren() {
      initAudioContext();
      playSirenSound(2, 0.5, 650, 1200, 0.35);
    }

    // 1. อ่านจำนวนแถวตั้งต้นในแท็บ CheatLogs
    function syncInitialRowCount() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success) {
              lastKnownRowCount = res.currentCount || 1;
              document.getElementById('textTotalCount').innerText = `${Math.max(0, lastKnownRowCount - 1)} รายการ`;
            }
          })
          .getLatestCheatLogs(999999);
      }
    }

    // 2. ตรวจสอบแถวใหม่ใน CheatLogs แบบ Real-time
    function checkNewCheatLogs() {
      if (!isPolling) return;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onNewLogsReceived)
          .withFailureHandler((err) => {
            console.warn('Poll error:', err);
            document.getElementById('statusText').innerText = 'ขาดการเชื่อมต่อชั่วคราว';
            document.getElementById('statusDot').className = 'w-2.5 h-2.5 rounded-full bg-amber-500 inline-block mr-1.5';
          })
          .getLatestCheatLogs(lastKnownRowCount);
      }
    }

    function onNewLogsReceived(res) {
      document.getElementById('statusText').innerText = 'กำลังตรวจจับ...';
      document.getElementById('statusDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block mr-1.5 animate-pulse';

      if (!res || !res.success) return;

      if (res.newLogs && res.newLogs.length > 0) {
        // อัปเดตจำนวนแถวที่ทราบแล้ว
        lastKnownRowCount = res.currentCount;
        document.getElementById('textTotalCount').innerText = `${Math.max(0, lastKnownRowCount - 1)} รายการ`;

        // นำรายการใหม่มาแสดงใน Feed
        const emptyMsg = document.getElementById('emptyMsg');
        if (emptyMsg) emptyMsg.remove();

        const feedList = document.getElementById('feedList');
        let maxWarningLevel = 1;

        res.newLogs.forEach(log => {
          const itemDiv = document.createElement('div');
          const warningNum = Number(log.warningLevel) || 1;
          if (warningNum > maxWarningLevel) maxWarningLevel = warningNum;

          let badgeColor = 'bg-amber-100 text-amber-800 border-amber-300';
          let borderLeft = 'border-l-4 border-amber-500';

          if (warningNum === 2) {
            badgeColor = 'bg-orange-100 text-orange-800 border-orange-300';
            borderLeft = 'border-l-4 border-orange-500';
          } else if (warningNum >= 3) {
            badgeColor = 'bg-red-100 text-red-800 border-red-300';
            borderLeft = 'border-l-4 border-red-600';
          }

          itemDiv.className = `p-2.5 bg-slate-50 rounded-lg border border-slate-200 ${borderLeft} space-y-1 transition hover:bg-slate-100`;
          itemDiv.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-800">${log.studentName || 'ไม่ระบุชื่อ'}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded border font-semibold ${badgeColor}">เตือนครั้งที่ ${log.warningLevel || 1}</span>
            </div>
            <div class="text-[11px] text-slate-600 flex items-center justify-between">
              <span>รหัส: ${log.studentId || '-'}</span>
              <span class="text-slate-400 text-[10px]"><i class="fa-regular fa-clock mr-0.5"></i>${log.timestamp || ''}</span>
            </div>
            <div class="text-[10px] text-rose-600 font-medium">
              <i class="fa-solid fa-triangle-exclamation mr-1"></i>${log.eventType || 'สลับหน้าจอ'}
            </div>
          `;

          // แทรกรายการใหม่ไว้บนสุด
          feedList.insertBefore(itemDiv, feedList.firstChild);
          document.getElementById('textLastTime').innerText = log.timestamp || new Date().toLocaleTimeString('th-TH');
        });

        // ส่งเสียงไซเรนบน Google Sheet ทันที!
        if (maxWarningLevel === 1) {
          playSirenSound(2, 0.55, 650, 1200, 0.35); // วี้-หว่อ 2 รอบ
        } else if (maxWarningLevel === 2) {
          playSirenSound(4, 0.35, 750, 1450, 0.45); // ไซเรนฉุกเฉินถี่ 4 รอบ
        } else {
          playSirenSound(6, 0.3, 800, 1500, 0.5); // ไซเรนตัดสิทธิ์ยาว 6 รอบ
        }
      }
    }

    function clearDisplayFeed() {
      const feedList = document.getElementById('feedList');
      feedList.innerHTML = `
        <div id="emptyMsg" class="text-center py-6 text-slate-400 text-xs">
          ยังไม่พบการสลับหน้าจอ<br>ระบบจะส่งเสียงไซเรนทันทีที่มีผู้สอบสลับแท็บ/จอ
        </div>
      `;
    }
  </script>

</body>
</html>
